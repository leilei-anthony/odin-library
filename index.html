<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <h1>My Library</h1>

    <form>
        <fieldset>
            <legend>Add a Book</legend>
            
            <label for="title">Title: </label>
            <input type="text" id="title" placeholder="The Hobbit">
            
            <label for="author">Author: </label>
            <input type="text" id="author" placeholder="J.R.R. Tolkien">
            
            <label for="pages">Pages: </label>
            <input type="number" id="pages" placeholder="288">
            
            <label for="read">Read: </label>
            <input type="checkbox" id="read" checked>
            
            <button type="reset" onclick="addBookToLibrary()">Add to Library</button>
        </fieldset>
    </form>

    <div id="library">
    </div>
    
</body>
</html>
